<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#0b5ed7" />
    </linearGradient>
    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc3545" />
      <stop offset="100%" stop-color="#b02a37" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBlue)" />

  <!-- House Silhouette -->
  <path d="M 16 32 L 32 17 L 48 32" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="20" y="31" width="24" height="22" rx="3" fill="#ffffff" />
  
  <!-- Windows Matrix -->
  <rect x="24" y="35" width="6" height="6" rx="1.5" fill="#0d6efd" />
  <rect x="34" y="35" width="6" height="6" rx="1.5" fill="#0d6efd" />
  <rect x="24" y="44" width="6" height="6" rx="1.5" fill="#0d6efd" />
  <rect x="34" y="44" width="6" height="6" rx="1.5" fill="#0d6efd" />

  <!-- Smart QR Accent Pin -->
  <circle cx="48" cy="18" r="11" fill="url(#favRed)" stroke="#ffffff" stroke-width="2" />
  <rect x="43" y="13" width="10" height="10" rx="1.5" fill="#ffffff" />
  <rect x="45" y="15" width="6" height="6" fill="#dc3545" />
  <rect x="47" y="17" width="2" height="2" fill="#ffffff" />
</svg>

