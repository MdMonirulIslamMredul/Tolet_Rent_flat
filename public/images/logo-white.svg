<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="wRentBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="wRentRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- LOGO ICON BADGE -->
  <g transform="translate(10, 10)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="90" height="90" rx="20" fill="url(#wRentBlueGrad)" />

    <!-- Modern Stylized House / Building -->
    <path d="M 22 46 L 45 24 L 68 46" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="27" y="44" width="36" height="32" rx="4" fill="#ffffff" />
    
    <!-- Windows Matrix -->
    <rect x="33" y="50" width="9" height="9" rx="2" fill="#1d4ed8" />
    <rect x="48" y="50" width="9" height="9" rx="2" fill="#1d4ed8" />
    <rect x="33" y="63" width="9" height="9" rx="2" fill="#1d4ed8" />
    <rect x="48" y="63" width="9" height="9" rx="2" fill="#1d4ed8" />

    <!-- Smart QR Accent Pin -->
    <g transform="translate(56, 12)">
      <circle cx="16" cy="16" r="15" fill="url(#wRentRedGrad)" stroke="#ffffff" stroke-width="2.5" />
      <rect x="9" y="9" width="14" height="14" rx="2" fill="#ffffff" />
      <rect x="11" y="11" width="10" height="10" fill="#ef4444" />
      <rect x="13" y="13" width="6" height="6" fill="#ffffff" />
      <rect x="15" y="15" width="2" height="2" fill="#ef4444" />
    </g>
  </g>

  <!-- TYPOGRAPHY FOR DARK BACKGROUND -->
  <g transform="translate(122, 10)">
    <!-- Main Brand Name -->
    <text x="0" y="54" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      <tspan fill="#ffffff">Rent</tspan><tspan fill="#ef4444">BD</tspan>
    </text>

    <!-- Smart QR Badge -->
    <rect x="180" y="24" width="76" height="26" rx="13" fill="rgba(59, 130, 246, 0.25)" stroke="#60a5fa" stroke-width="1.2" />
    <text x="218" y="41" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">
      SMART QR
    </text>

    <!-- Tagline Subtitle -->
    <text x="2" y="77" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#94a3b8">
      RENTAL PLATFORM
    </text>
  </g>
</svg>

